<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "Qaïda Nourania" }}</title><style>
:root{--green:#155b49;--pale:#eaf5f0;--ink:#172033;--muted:#667085;--line:#e5e9f0}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.5 system-ui,sans-serif}header{background:#123f36;color:white;padding:18px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:20px;font-weight:800}header a{color:white}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px #17203308}h1{margin:0 0 8px;font-size:25px}h2{font-size:19px}small,.muted{color:var(--muted)}label{display:block;font-weight:650;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #cfd6df;border-radius:10px;font:inherit}.btn{display:inline-block;background:var(--green);color:white;border:0;border-radius:10px;padding:11px 16px;text-decoration:none;font-weight:700;cursor:pointer}.btn.light{background:white;color:var(--green);border:1px solid #b7d5c9}.flash{padding:11px 14px;border-radius:10px;margin:12px 0;background:#eaf5f0}.flash.error{background:#fff0ee;color:#912018}.flash.success{background:#eaf7ef;color:#14532d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{padding:15px;border-radius:12px;background:#f7faf9}.metric b{display:block;font-size:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.ar{font:32px "Noto Naskh Arabic","Amiri",serif;direction:rtl;text-align:right}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{background:var(--pale);color:var(--green);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}form.inline{display:inline}button.link{background:none;border:0;color:white;text-decoration:underline;cursor:pointer;font:inherit}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.card{padding:16px}table{font-size:13px}}
</style></head><body><header><div><div class="brand">◈ Qaïda Nourania</div><small style="color:#d5e7e1">Plateforme d’apprentissage</small></div>{% if user %}<div>{{ user['display_name'] }} · {{ 'Professeur' if user['role']=='teacher' else 'Élève' }} <form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link">Déconnexion</button></form></div>{% endif %}</header><main>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
